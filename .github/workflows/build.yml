# Builds the ffdl app for Windows, macOS and Linux.
# Run from the Actions tab: the builds are attached to the run as artifacts.
# Push a tag like v1.0.0: the builds are also published as a GitHub Release.
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python build.py

      # Zip/tar so the executable permission and the .app bundle survive the upload
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive dist/ffdl.exe ffdl-windows.zip
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/ffdl.app ffdl-macos.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ffdl-linux.tar.gz -C dist ffdl

      - uses: actions/upload-artifact@v4
        with:
          name: ffdl-${{ runner.os }}
          path: ffdl-*.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: ffdl-*.*
          generate_release_notes: true
